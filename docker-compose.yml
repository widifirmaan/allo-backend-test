#   docker compose up --build    # jalan (app di :4110, mongo di :27017)
#   docker compose down          # berhenti (data mongo tetap tersimpan di volume)
#   docker compose down -v       # berhenti + hapus data mongo
services:
  mongo:
    image: mongo:7
    container_name: splitbill-mongo
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"] #limitasi ram
    ports:
      - "27017:27017"
    volumes:
      - data-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: split-bill-api
    restart: unless-stopped
    ports:
      - "4110:4110"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/splitbill
      APP_SEED: "false" # Data demo (grup demo-trip-bandung). Ganti "false" jadi "true" untuk isi.
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  data-mongo:
